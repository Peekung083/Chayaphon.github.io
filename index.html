<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawasaki Bigbike Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Kawasaki Bigbike Management</h1>
        
        <div class="form-container">
            <h2>Add New Bike</h2>
            <form id="bikeForm">
                <input type="hidden" id="bikeId">
                <div class="form-group">
                    <label for="model">Model:</label>
                    <input type="text" id="model" required>
                </div>
                <div class="form-group">
                    <label for="year">Year:</label>
                    <input type="number" id="year" required>
                </div>
                <div class="form-group">
                    <label for="engine">Engine:</label>
                    <input type="text" id="engine" required>
                </div>
                <div class="form-group">
                    <label for="price">Price:</label>
                    <input type="text" id="price" required>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="image">Image URL:</label>
                    <input type="url" id="image" required>
                </div>
                <button type="submit" id="submitBtn">Add Bike</button>
                <button type="button" id="cancelBtn" style="display: none;">Cancel</button>
            </form>
        </div>

        <div class="bikes-container">
            <h2>Bike List</h2>
            <div id="bikesList"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
